<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leadovi</title>
<style>
:root{--bg:#f3f4f2;--panel:#fff;--ink:#1c2321;--mute:#66706c;--line:#dde1de;--acc:#0f766e;--accink:#fff;--warn:#b45309;--bad:#b91c1c;--chip:#e8ece9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181a;--panel:#1d2326;--ink:#e8ecea;--mute:#98a39e;--line:#2c3438;--acc:#2dd4bf;--accink:#06201c;--warn:#fbbf24;--bad:#f87171;--chip:#283034}}
:root[data-theme="dark"]{--bg:#14181a;--panel:#1d2326;--ink:#e8ecea;--mute:#98a39e;--line:#2c3438;--acc:#2dd4bf;--accink:#06201c;--warn:#fbbf24;--bad:#f87171;--chip:#283034}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);margin:0}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 14px}
.ghost{background:none;border:0;color:var(--mute);font-size:13px;padding:4px 6px;border-radius:6px;cursor:pointer}
.ghost:hover:not(:disabled){color:var(--ink);text-decoration:underline}
.ghost:disabled{opacity:.35;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 11px;border-radius:999px;cursor:pointer;font:inherit}
.tab b{margin-left:6px;color:var(--mute)}
.tab.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.tab.on b{color:var(--accink)}
.tab.alert b{color:var(--bad)}
.tab.on.alert b{color:var(--accink)}
button,input,select{font:inherit;color:var(--ink)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
button.b{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.b.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.b.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.form label{display:flex;flex-direction:column;gap:3px;color:var(--mute);font-size:13px}
.row{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.row.late{border-left:4px solid var(--bad)}
.row.today{border-left:4px solid var(--warn)}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top b{font-size:16px;margin-right:4px}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12.5px}
.meta{color:var(--mute);margin:6px 0;display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.meta .hot{color:var(--bad);font-weight:600}
.meta .tod{color:var(--warn);font-weight:600}
.meta:empty{display:none}
.grp{font-size:15px;font-weight:600;margin:20px 0 8px}
.x{position:absolute;top:6px;right:8px;width:26px;height:26px;border:0;border-radius:6px;background:none;color:var(--mute);font-size:19px;line-height:1;cursor:pointer;opacity:.5;padding:0}
.x:hover,.x:focus-visible{opacity:1;color:var(--bad);background:var(--chip)}
.top{padding-right:30px}
textarea.note{display:block;min-height:0;height:35px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:2px 0 8px;resize:none;overflow:hidden;line-height:1.4}
.nw{position:relative}
.nw .tg{display:none;position:absolute;right:3px;top:3px;width:29px;height:29px;border:0;border-radius:6px;background:none;cursor:pointer;padding:0}
.nw.multi .tg{display:block}
.nw .tg:hover{background:var(--chip)}
.nw .tg::before{content:'';position:absolute;left:10px;top:8px;width:6px;height:6px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:rotate(45deg);transition:transform .22s ease,top .22s ease}
.nw:focus-within .tg::before{transform:rotate(225deg);top:12px}
textarea.note{transition:height .24s cubic-bezier(.2,.7,.2,1),border-color .18s ease}
.nw.multi textarea.note{padding-right:30px}
@media (prefers-reduced-motion:reduce){textarea.note,.nw .tg::before{transition:none}}
.addform{display:grid;gap:12px;margin-top:12px}
.lbl[hidden]{display:none}
.lbl{display:flex;flex-direction:column;gap:5px;color:var(--mute);font-size:13px}
#n_name{font-size:16px;font-weight:600;color:var(--ink);padding:9px 10px;border:1.5px solid var(--mute)}
#n_note{font:inherit;font-size:14px;min-height:84px;resize:vertical;padding:8px 10px;color:var(--ink);background:var(--panel);border:1px dashed var(--line);border-left:3px solid var(--acc);border-radius:8px;line-height:1.45}
.addbtn{display:flex;justify-content:flex-end}
.grab{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mute);padding:0 6px 0 0;font-size:18px;line-height:1}
.dragging{opacity:.35}
.ghost-card{position:fixed;z-index:1000;pointer-events:none;opacity:.93;box-shadow:0 10px 28px rgba(0,0,0,.28);margin:0;transform:rotate(1deg)}
.zone{border-radius:12px;padding:2px;min-height:44px}
.over{outline:2px dashed var(--acc);outline-offset:2px;background:color-mix(in srgb,var(--acc) 10%,transparent)}
.dgrp{font-size:13.5px;font-weight:600;color:var(--mute);margin:12px 0 6px}
.note{width:100%;margin:2px 0 8px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--mute);padding:24px 8px;text-align:center}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;margin:6px 0}
.small{color:var(--mute);font-size:13px;margin:4px 0}
button,input,select,textarea{transition:background-color .18s ease,border-color .18s ease,color .18s ease}
details[data-animating]{overflow:hidden}
@media (prefers-reduced-motion:reduce){button,input,select,textarea{transition:none}}
.field-error{color:var(--bad);font-size:12px;margin:0;animation:error-in .18s ease-out}
.field-error[hidden]{display:none}
.addform [aria-invalid="true"]{border-color:var(--bad)!important}
@keyframes error-in{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.field-error{animation:none}}
.add-success{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--acc);border-left:4px solid var(--acc);border-radius:8px;background:color-mix(in srgb,var(--acc) 10%,var(--panel));color:var(--ink);font-size:14px}
.add-success:empty{display:none}
.addbtn{gap:10px;align-items:center}
.note-display{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:2px 0;min-height:35px}
.note-display a{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.nw:not(.editing) textarea.note,.nw:not(.editing) .tg{display:none}
.nw.editing .note-display,.nw.editing .note-edit{display:none}
.note-edit{margin-bottom:6px}
</style>
</head>
<body>
<main>
<h1>Leadovi</h1>
<div class="subrow"><p class="sub" id="sub"></p><button class="ghost" id="undo" title="Poništi poslednju izmenu">↶ Poništi</button></div>

<div class="tabs" id="tabs"></div>
<div id="list"></div>

<details id="add_panel">
<summary id="add_summary">Dodaj prospect-a</summary>
<div class="addform">
<label class="lbl">Naziv<input id="n_name" placeholder="npr. Stomatološka ordinacija Dent" aria-describedby="n_name_error"><span class="field-error" id="n_name_error" role="alert" hidden>Unesite naziv prospecta.</span></label>
<label class="lbl">Beleška<textarea id="n_note" rows="3" placeholder="Beleška za ovog prospecta" aria-describedby="n_note_error"></textarea><span class="field-error" id="n_note_error" role="alert" hidden>Unesite belešku.</span></label>
<div class="lbl" id="contact_date" hidden><label for="n_first" id="date_label">Datum prve poruke</label><div class="btns"><input type="date" id="n_first" aria-describedby="n_first_error"><button type="button" class="b" id="date_today">Danas</button></div><span class="field-error" id="n_first_error" role="alert" hidden>Izaberite datum ili kliknite „Danas“.</span></div>
<div class="add-success" id="add_success" role="status" aria-live="polite"></div>
<div class="addbtn"><button class="b p" id="add">Dodaj</button></div>
</div>
</details>
</main>

<script>
// Smooth native disclosure, including closing and rapid repeated clicks.
document.querySelectorAll('details').forEach(panel=>{
  const summary=panel.querySelector('summary'),content=summary.nextElementSibling;
  let animation=null,target=panel.open;
  summary.addEventListener('click',event=>{
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    event.preventDefault();
    const from=panel.getBoundingClientRect().height;
    target=animation?!target:!panel.open;
    if(animation){animation.onfinish=null;animation.cancel()}
    panel.style.height='';
    panel.open=false;
    const closedHeight=panel.getBoundingClientRect().height;
    panel.open=true;
    const openHeight=panel.getBoundingClientRect().height;
    panel.dataset.animating='true';
    animation=panel.animate([{height:from+'px'},{height:(target?openHeight:closedHeight)+'px'}],{duration:220,easing:'cubic-bezier(.2,.7,.2,1)',fill:'both'});
    if(content)content.animate([{opacity:target?0:1,transform:target?'translateY(-4px)':'translateY(0)'},{opacity:target?1:0,transform:target?'translateY(0)':'translateY(-4px)'}],{duration:180,easing:'ease-out'});
    animation.onfinish=()=>{panel.open=target;animation.cancel();animation=null;delete panel.dataset.animating};
  });
});

const FU=['Follow-up 1','Follow-up 2','Follow-up 3','Follow-up 4','Follow-up 5','Follow-up 6','Break-Up'];
const DAYS={'Follow-up 1':4,'Follow-up 2':7,'Follow-up 3':10,'Follow-up 4':13,'Follow-up 5':16,'Follow-up 6':19,'Break-Up':21};
const LBL={};FU.forEach(g=>LBL[g]=g.replace('Follow-up ','Follow-Up #')+' (dan '+DAYS[g]+')');
const nm=g=>LBL[g]?LBL[g].replace(/ \(.*/,''):g;
const STAGES=['Prospect','Prva poruka',...FU,'Zainteresovan','Won','Rejected','Future follow-up'];
const ACTIVE=['Prva poruka',...FU,'Future follow-up'];
const NEXT={'Prospect':'Prva poruka','Prva poruka':'Follow-up 1','Follow-up 1':'Follow-up 2','Follow-up 2':'Follow-up 3','Follow-up 3':'Follow-up 4','Follow-up 4':'Follow-up 5','Follow-up 5':'Follow-up 6','Follow-up 6':'Break-Up'};
const KEY='leads-v1';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((new Date(today()+'T00:00:00')-new Date(s+'T00:00:00'))/864e5);
const fmt=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.':'nije postavljeno';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function noteLinks(value){
  const text=String(value||'');let result='',position=0;
  const pattern=/\b(?:https?:\/\/|www\.)[^\s<>"']+/gi;
  for(const match of text.matchAll(pattern)){
    let url=match[0].replace(/[.,;!?]+$/,'');
    while(url.endsWith(')')&&(url.match(/\)/g)||[]).length>(url.match(/\(/g)||[]).length)url=url.slice(0,-1);
    result+=esc(text.slice(position,match.index));
    const href=/^www\./i.test(url)?'https://'+url:url;
    result+='<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a>';
    position=match.index+url.length;
  }
  return result+esc(text.slice(position));
}
function notePreview(value){return noteLinks(value)||'<span class="small">Beleška</span>'}

const uid=()=>Math.random().toString(36).slice(2,10);
const ago=s=>{if(!s)return'';const d=diff(s);return d===0?'danas':d===1?'juče':'pre '+d+' dana'};

const SEED={
'Prospect':['autotapetarija BEBA-S','Auto škola Doctor Drive','Odgajivačnica Maksimović','Odgajivačnica Infinity passion','Auto škola Janjušević','Auto škola Profesionalac ZSS','Auto Škola TRAG'],
'Prva poruka':['Stomatološka Ordinacija Bulevar Dent','Stomatološka Ordinacija Dr. Djukić Marko','Odgajivačnica LUXMARRY','Stomatološka Ordinacija Mirčić dent','Stomatološka Ordinacija Ivanović','Lux Detailing Centar Indjija'],
'Rejected':['Lazarević Detailing','Paulin Detailing','Hakuna Matata','Stomatološka Ordinacija Jelena','Stomatološka Ordinacija Dentalis','Odgajivačnica "Od Kuce Don"','Masaže Lukić','Zoca Detailing']};
const fixStage=l=>{if(l.stage==='Odbili')l.stage='Rejected';return l};
const mk=(o)=>fixStage(mk0(o));
const mk0=(o)=>Object.assign({id:uid(),name:'',ch:'WhatsApp',stage:'Prospect',status:'',first:'',last:'',next:'',closed:'',reason:'',note:''},o);
let leads=[],view='prospect',hist=[];
try{hist=JSON.parse(localStorage.getItem('leads-hist')||'[]')}catch(e){hist=[]}
function saveHist(){try{localStorage.setItem('leads-hist',JSON.stringify(hist))}catch(e){}}
function snap(){hist.push(JSON.stringify(leads));if(hist.length>50)hist.shift();saveHist()}
function undo(){if(!hist.length)return;leads=JSON.parse(hist.pop());saveHist();save();render()}

function load(){try{const r=localStorage.getItem(KEY);if(r){leads=JSON.parse(r);let ch=false;leads.forEach(l=>{const o=l.stage;fixStage(l);if(l.stage!==o)ch=true});try{if(!localStorage.getItem('leads-mig-kont')){const K=new Set(SEED['Prva poruka']);leads.forEach(l=>{if(l.stage==='Follow-up 1'&&K.has(l.name)){l.stage='Prva poruka';ch=true}});localStorage.setItem('leads-mig-kont','1')}}catch(e){}
  if(ch)save();return}}catch(e){}
  seedLeads();save()}
function seedLeads(){leads=[];for(const st in SEED)SEED[st].forEach(n=>leads.push(mk({name:n,stage:st,status:st==='Prospect'||st==='Rejected'?'':'Poslato'})))}
function resetAll(){snap();seedLeads();view='prospect';save();render()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(leads))}catch(e){}}

const isAct=l=>ACTIVE.includes(l.stage);
const DROP={prospect:'Prospect',aktivni:'Prva poruka',danas:'Follow-up 1',zainteresovan:'Zainteresovan',odbili:'Rejected',won:'Won'};
const VIEWS=[
['prospect','Prospect',l=>l.stage==='Prospect',0],
['aktivni','Kontaktiran',l=>l.stage==='Prva poruka',0],
['danas','Follow-Up',l=>FU.includes(l.stage),0],
['zainteresovan','Zainteresovan',l=>l.stage==='Zainteresovan',0],
['odbili','Rejected',l=>l.stage==='Rejected',0],
['won','Won',l=>l.stage==='Won',0],
['svi','Svi',l=>true,0]];

function render(){
  const contacted=view==='aktivni';
  document.getElementById('add_panel').hidden=!(contacted||view==='prospect');
  document.getElementById('contact_date').hidden=!(contacted||view==='prospect');
  document.getElementById('date_label').textContent=contacted?'Datum prve poruke':'Datum dodavanja';
  document.getElementById('n_first').disabled=!(contacted||view==='prospect');
  document.getElementById('add_summary').textContent=contacted?'Dodaj kontaktiranog prospect-a':'Dodaj prospect-a';
  document.getElementById('undo').disabled=!hist.length;
  document.getElementById('sub').textContent='Danas je '+fmt(today())+'. Ukupno leadova: '+leads.length;
  document.getElementById('tabs').innerHTML=VIEWS.map(v=>{const c=leads.filter(v[2]).length;
    return '<button class="tab'+(view===v[0]?' on':'')+(v[3]&&c?' alert':'')+'" data-view="'+v[0]+'"'+(DROP[v[0]]?' data-drop="'+DROP[v[0]]+'"':'')+'>'+v[1]+'<b>'+c+'</b></button>'}).join('');
  const cur=VIEWS.find(v=>v[0]===view);
  const items=leads.filter(cur[2]);
  document.getElementById('list').innerHTML=view==='danas'
    ?FU.map(g=>{const it=items.filter(l=>l.stage===g);return '<div class="zone" data-drop="'+g+'"><h2 class="grp">'+LBL[g]+' <span class="small">'+it.length+'</span></h2>'+(it.length?groupByDate(it):'<div class="small">Nema leadova.</div>')+'</div>'}).join('')
    :view==='prospect'&&items.length?groupByDate(items,'added',false)
    :view==='aktivni'&&items.length?groupByDate(items)
    :(items.length?items.map(l=>rowHtml(l)).join(''):'<div class="empty">Nema leadova u ovom pregledu.</div>');
}

const fmtFull=d=>d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4)+'.';
function groupByDate(it,dateField='last',showSent=true){
  const by={};it.forEach(l=>{const k=l[dateField]||'';(by[k]=by[k]||[]).push(l)});
  const keys=Object.keys(by).sort((a,b)=>a===''?1:b===''?-1:a.localeCompare(b));
  return keys.map(k=>'<h3 class="dgrp">'+(k?fmtFull(k):'Bez datuma')+' <span class="small">'+by[k].length+'</span></h3>'+by[k].map(l=>rowHtml(l,showSent)).join('')).join('');
}
const isMulti=n=>(n||'').includes('\n')||(n||'').length>60;
const tagOf=l=>l.stage==='Prva poruka'?'Kontaktiran':l.stage.replace('Follow-up ','Follow-Up #');
function sviHtml(l){
  return '<div class="row" data-id="'+l.id+'"><div class="top"><b>'+esc(l.name)+'</b><span class="chip">'+esc(tagOf(l))+'</span></div>'
  +'<div class="nw'+(isMulti(l.note)?' multi':'')+'"><div class="note-display">'+notePreview(l.note)+'</div><button type="button" class="ghost note-edit">Uredi belešku</button><textarea class="note" data-f="note" rows="1" placeholder="Beleška">\n'+esc(l.note||'')+'</textarea><button type="button" class="tg" tabindex="-1" aria-label="Otvori ili zatvori belešku"></button></div></div>';
}
function rejHtml(l){
  const c=l.closed||'',r=l.reason||'';
  return '<div class="row" data-id="'+l.id+'"><div class="top"><button class="x" data-a="del" title="Obriši" aria-label="Obriši">×</button><span class="grab" title="Prevuci karticu">⠿</span><b>'+esc(l.name)+'</b>'+(view==='svi'?'<span class="chip">Rejected</span>':'')+'</div>'
  +'<div class="meta"><span>Datum: <input type="date" data-f="closed" value="'+c+'">'+(c?' ('+ago(c)+')':' <span class="tod">upiši datum</span>')+'</span>'
  +'<span>Način odbijanja: <select data-f="reason"><option value="">Izaberi</option>'+['Seen','Odbio'].map(o=>'<option'+(o===r?' selected':'')+'>'+o+'</option>').join('')+'</select></span></div></div>';
}
function rowHtml(l,showSent){
  if(view==='svi')return sviHtml(l);
  if(l.stage==='Rejected')return rejHtml(l);
  const late=isAct(l)&&l.next&&l.next<today(),tod=isAct(l)&&l.next===today();
  const nx=NEXT[l.stage];
  const sendLbl=l.stage==='Prospect'?'Poslata prva poruka':nx&&isAct(l)?'Poslat '+nx.replace('Follow-up ','Follow-Up #'):'';
  let nextInfo='';
  if(isAct(l)){nextInfo='Sledeći follow-up: <input type="date" data-f="next" value="'+l.next+'">'+(late?' <span class="hot">kasni '+diff(l.next)+' d</span>':tod?' <span class="tod">danas</span>':'')}
  return '<div class="row'+(late?' late':tod?' today':'')+'" data-id="'+l.id+'">'
  +'<div class="top"><button class="x" data-a="del" title="Obriši" aria-label="Obriši">×</button><span class="grab" title="Prevuci karticu">⠿</span><b>'+esc(l.name)+'</b>'+(view==='svi'?'<span class="chip">'+l.stage+'</span>'+(l.status?'<span class="chip">'+l.status+'</span>':''):'')+'</div>'
  +'<div class="meta">'
  +(showSent?'<span>Datum: <input type="date" data-f="last" value="'+(l.last||'')+'">'+(l.last?' ('+ago(l.last)+')':' <span class="tod">upiši datum</span>')+'</span>':'')
  +(l.stage==='Rejected'||l.stage==='Won'?'<span>'+(l.stage==='Rejected'?'Datum odbijanja':'Datum won')+': <input type="date" data-f="closed" value="'+(l.closed||'')+'">'+(l.closed?' ('+ago(l.closed)+')':' <span class="tod">upiši datum</span>')+'</span>':'')+'</div>'
  +'<div class="nw'+(isMulti(l.note)?' multi':'')+'"><div class="note-display">'+notePreview(l.note)+'</div><button type="button" class="ghost note-edit">Uredi belešku</button><textarea class="note" data-f="note" rows="1" placeholder="Beleška">\n'+esc(l.note||'')+'</textarea><button type="button" class="tg" tabindex="-1" aria-label="Otvori ili zatvori belešku"></button></div>'
  +'<div class="btns">'
  +(sendLbl?'<button class="b p" data-a="send">'+sendLbl+'</button>':'')
  +(l.stage!=='Rejected'&&l.stage!=='Prospect'&&l.stage!=='Won'?'<button class="b" data-a="no">Rejected</button>':'')
  +((isAct(l)||l.stage==='Zainteresovan')?'<button class="b" data-a="won">Won</button>':'')
  +'</div></div>';
}

function act(l,a){
  const t=today();snap();
  if(a==='send'){const cur=l.stage,nx=NEXT[cur];if(!nx)return;if(cur==='Prospect'&&!l.first)l.first=t;l.stage=nx;l.last=t;l.status='Poslato';const s2=NEXT[nx];l.next=s2&&DAYS[s2]?addDays(l.first||t,DAYS[s2]):''}
  else if(a==='read')l.status='Pročitano';
  else if(a==='reply'){l.status='Odgovorio';l.stage='Zainteresovan';l.last=t;l.next='';l.closed=''}
  else if(a==='no'){l.stage='Rejected';l.next='';l.closed=t}
  else if(a==='won'){l.stage='Won';l.next='';l.closed=t}
  else if(a==='del'){leads=leads.filter(x=>x!==l)}
  save();render();
}

let sectionAnimation=null;
document.getElementById('tabs').onclick=e=>{
  const b=e.target.closest('[data-view]');if(!b||view===b.dataset.view)return;
  if(sectionAnimation)sectionAnimation.cancel();
  view=b.dataset.view;render();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    sectionAnimation=document.getElementById('list').animate(
      [{opacity:.72,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],
      {duration:180,easing:'cubic-bezier(.2,.7,.2,1)'});
  }
};
document.getElementById('list').onclick=e=>{const edit=e.target.closest('.note-edit');if(edit){const w=edit.closest('.nw');w.classList.add('editing');w.querySelector('textarea').focus();return}const b=e.target.closest('[data-a]');if(!b)return;const l=leads.find(x=>x.id===b.closest('.row').dataset.id);if(l)act(l,b.dataset.a)};
document.getElementById('list').onchange=e=>{const f=e.target.dataset.f;if(!f)return;const l=leads.find(x=>x.id===e.target.closest('.row').dataset.id);if(!l)return;
  if(f==='note'){snap();l.note=e.target.value;save();const w=e.target.closest('.nw');if(w)w.classList.toggle('multi',isMulti(l.note));return}
  snap();l[f]=e.target.value;if(f==='last'&&l.stage==='Prva poruka'){l.first=l.last;l.next=l.last?addDays(l.last,DAYS['Follow-up 1']):''}
  if(f==='stage'&&!isAct(l)&&l.stage!=='Prospect')l.next='';
  if(f==='stage'){if(l.stage==='Rejected'||l.stage==='Won'){if(!l.closed)l.closed=today()}else l.closed=''}
  save();render()};

const addFields=['n_name','n_note','n_first'];
function setFieldError(id,invalid){
  document.getElementById(id+'_error').hidden=!invalid;
  const field=document.getElementById(id);
  if(invalid)field.setAttribute('aria-invalid','true');else field.removeAttribute('aria-invalid');
}
addFields.forEach(id=>{const field=document.getElementById(id);['input','change'].forEach(event=>field.addEventListener(event,()=>{if(field.value.trim())setFieldError(id,false)}))});
document.getElementById('date_today').onclick=()=>{document.getElementById('n_first').value=today();setFieldError('n_first',false)};

let successTimer=null;
document.getElementById('add').onclick=()=>{
  const inp=document.getElementById('n_name'),name=inp.value.trim();
  const missing=addFields.filter(id=>!document.getElementById(id).value.trim());
  addFields.forEach(id=>setFieldError(id,missing.includes(id)));
  if(missing.length){document.getElementById(missing[0]).focus();return}
  const nt=document.getElementById('n_note');
  const contacted=view==='aktivni',date=document.getElementById('n_first'),first=contacted?(date.value||today()):'';
  snap();const added=mk({name,note:nt.value.trim(),stage:contacted?'Prva poruka':'Prospect',status:contacted?'Poslato':'',added:contacted?'':date.value,first,last:first,next:first?addDays(first,DAYS['Follow-up 1']):''});leads.push(added);save();inp.value='';nt.value='';date.value='';view=contacted?'aktivni':'prospect';render();inp.focus();
  const message=document.getElementById('add_success');
  message.innerHTML='<span><strong>✓ Prospect je uspešno dodat</strong><br>'+esc(added.name)+'</span><button type="button" class="b">Prikaži</button>';
  message.querySelector('button').onclick=()=>{const card=document.querySelector('.row[data-id="'+added.id+'"]');if(card){card.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});card.animate([{outline:'2px solid var(--acc)',outlineOffset:'3px'},{outline:'2px solid transparent',outlineOffset:'3px'}],{duration:1600})}};
  clearTimeout(successTimer);successTimer=setTimeout(()=>{message.textContent=''},6500);
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const card=document.querySelector('.row[data-id="'+added.id+'"]');
    if(card)card.animate([{opacity:.3,transform:'translateY(6px)',backgroundColor:'var(--chip)'},{opacity:1,transform:'translateY(0)',backgroundColor:'var(--panel)'}],{duration:650,easing:'cubic-bezier(.2,.7,.2,1)'});
    message.animate([{opacity:0,transform:'translateY(2px)'},{opacity:1,transform:'translateY(0)'}],{duration:200,easing:'ease-out'});
  }
};
document.getElementById('n_name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('n_note').focus()}});
document.getElementById('n_note').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('add').click()}});

function moveTo(l,st){
  if(l.stage===st)return;
  snap();
  const from=l.stage,t=today();
  l.stage=st;
  if(st==='Rejected'||st==='Won'){if(!l.closed)l.closed=t;l.next=''}else l.closed='';
  const seq=['Prospect','Prva poruka',...FU],a0=seq.indexOf(from),b0=seq.indexOf(st);
  if(b0>=0){if(a0>=0&&b0>a0){if(a0===0&&!l.first)l.first=t;l.last=t;l.status='Poslato'}const s2=NEXT[st];l.next=s2&&DAYS[s2]?addDays(l.first||t,DAYS[s2]):''}
  else if(st!=='Rejected'&&st!=='Won')l.next='';
  save();render();
}
let drag=null;
function dropAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('[data-drop]'):null}
function dragMove(e){
  if(!drag)return;
  drag.ghost.style.left=(e.clientX-24)+'px';drag.ghost.style.top=(e.clientY-18)+'px';
  const t=dropAt(e.clientX,e.clientY);
  if(drag.over&&drag.over!==t)drag.over.classList.remove('over');
  if(t)t.classList.add('over');
  drag.over=t;
  if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-70)window.scrollBy(0,14);
}
function dragEnd(e){
  if(!drag)return;
  document.removeEventListener('pointermove',dragMove);
  document.removeEventListener('pointerup',dragEnd);
  document.removeEventListener('pointercancel',dragEnd);
  const d=drag;drag=null;
  const t=e.type==='pointerup'?dropAt(e.clientX,e.clientY):null;
  d.ghost.remove();if(d.over)d.over.classList.remove('over');
  d.row.classList.remove('dragging');
  if(t&&t.dataset.drop)moveTo(d.l,t.dataset.drop);
}
document.getElementById('list').addEventListener('pointerdown',e=>{
  const h=e.target.closest('.grab');if(!h||drag)return;
  const row=h.closest('.row');const l=leads.find(x=>x.id===row.dataset.id);if(!l)return;
  e.preventDefault();
  const ghost=row.cloneNode(true);ghost.classList.add('ghost-card');ghost.style.width=row.offsetWidth+'px';
  document.body.appendChild(ghost);row.classList.add('dragging');
  drag={l,row,ghost,over:null};
  dragMove(e);
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd);
  document.addEventListener('pointercancel',dragEnd);
});
const expand=t=>{t.style.height=Math.max(35,t.scrollHeight)+'px'};
const fit=t=>{t.style.transition='none';t.style.height='auto';t.style.height=t.scrollHeight+'px';requestAnimationFrame(()=>{t.style.transition=''})};
document.getElementById('list').addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('note'))expand(e.target)});
document.getElementById('list').addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('note')){t.style.height='';t.scrollTop=0;const w=t.closest('.nw');if(w){w.querySelector('.note-display').innerHTML=notePreview(t.value);w.classList.remove('editing')}}});
document.getElementById('list').addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('note'))fit(e.target)});
document.getElementById('list').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&e.target.classList&&e.target.classList.contains('note')){e.preventDefault();e.target.blur()}
});
let tgOpen=false;
document.getElementById('list').addEventListener('mousedown',e=>{const b=e.target.closest&&e.target.closest('.tg');if(!b)return;e.preventDefault();const t=b.parentNode.querySelector('textarea');tgOpen=document.activeElement===t});
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.tg');if(!b)return;const t=b.parentNode.querySelector('textarea');if(!t)return;if(tgOpen)t.blur();else t.focus();tgOpen=false});
document.getElementById('undo').onclick=undo;
load();
{const n=leads.length;leads=leads.filter(l=>l.id!=='test-fu');if(leads.length!==n)save()}
try{if(!localStorage.getItem('leads-test-v2')){
  leads.push(mk({id:'test-fu2',name:'Test Follow-Up',stage:'Follow-up 1',status:'Poslato',first:addDays(today(),-4),last:today(),next:addDays(today(),3),note:'Test kartica'}));
  save();localStorage.setItem('leads-test-v2','1')}}catch(e){}
try{if(!localStorage.getItem('leads-test-v3')){
  leads.push(mk({id:'test-won',name:'Test Won',stage:'Won',status:'Poslato',first:addDays(today(),-10),last:addDays(today(),-2),closed:today(),note:'Test kartica'}));
  save();localStorage.setItem('leads-test-v3','1')}}catch(e){}
render();
</script>
